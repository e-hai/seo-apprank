name: Daily SEO pages build & deploy (Cloudflare Pages)

# 每天北京时间 09:00（UTC 01:00）重建并部署到 Cloudflare Pages。
# 数据源 e-hai/Appstore_Top_30 在北京时间 08:00 更新，此处错后 1 小时。
# 托管：Cloudflare Pages（免费额度 500 构建/月、无限带宽、自带 *.pages.dev + 免费 SSL）。
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apprank-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 本项目纯 Python 标准库、零 pip 依赖，故不启用 cache: pip（否则会因找不到 requirements.txt 报错）

      # 恢复上一轮的增量状态（.build_state.json），用于判断"实质变化"
      - name: Restore incremental state
        uses: actions/cache@v4
        with:
          path: .build_state.json
          key: apprank-state-${{ github.run_id }}
          restore-keys: apprank-state-

      # 注意：GitHub Actions 的 if: 条件不支持 secrets 上下文，故把空值判断放进脚本内。
      - name: Configure IndexNow key (optional)
        run: |
          python3 - <<'PY'
          import os, pathlib
          key = os.environ.get('INDEXNOW_KEY', '').strip()
          if not key:
              print('[i] INDEXNOW_KEY not set, skipping')
          else:
              p = pathlib.Path('src/config.py')
              s = p.read_text(encoding='utf-8')
              s = s.replace('INDEXNOW_KEY = ""', f'INDEXNOW_KEY = "{key}"')
              p.write_text(s, encoding='utf-8')
              print('[i] INDEXNOW_KEY configured')
          PY
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      # 全量模式：内部按 state 自动跳过无实质变化的页；只对变化 URL 提交 IndexNow。
      # SITE_BASE_URL 来自 GitHub Variables（换独立域名时只需改它），未设置则用代码默认值 apprank.pages.dev。
      - name: Build static SEO pages (full + incremental)
        run: python3 src/generate.py --mode full --out site --state .build_state.json
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://apprank.pages.dev' }}

      - name: Sanity check (fail fast)
        run: |
          test -f site/sitemap.xml || { echo "no sitemap"; exit 1; }
          n=$(find site -name index.html | wc -l)
          echo "generated pages: $n"
          test "$n" -ge 100 || { echo "too few pages for full mode"; exit 1; }
          if grep -rl 'FAQPage' site --include=*.html | grep -q .; then
            echo "ERROR: FAQPage schema found (deprecated)"; exit 1
          fi
          # 中文品类名只允许出现在中文语言目录 /zh/ 下；其他语言（含英文/韩/日/土）必须本地化
          if find site -name index.html -not -path '*/zh/*' -print0 | xargs -0 grep -l '游戏\|总榜' 2>/dev/null | grep -q .; then
            echo "ERROR: Chinese category leaked into non-Chinese pages"; exit 1
          fi
          if grep -rl 'example.com' site --include=*.html | grep -q .; then
            echo "ERROR: placeholder domain found"; exit 1
          fi
          echo "hreflang pages: $(grep -rl 'rel="alternate"' site --include=*.html | wc -l)"

      # 注入搜索引擎验证文件（GSC / Bing）。site/ 不入库、每次重新生成，
      # 故把验证文件名+内容存进 GitHub Secrets，这里每次部署前写回站点根目录。
      # 未配置则跳过——不影响正常部署。
      - name: Inject search-console verification files (optional)
        run: |
          python3 - <<'PY'
          import os, pathlib
          pairs = [
              ("GSC",  os.environ.get("GSC_VERIFY_FILE", ""),  os.environ.get("GSC_VERIFY_CONTENT", "")),
              ("BING", os.environ.get("BING_VERIFY_FILE", ""), os.environ.get("BING_VERIFY_CONTENT", "")),
          ]
          for tag, name, content in pairs:
              if not name and not content:
                  print(f"[i] {tag} verification not configured, skip")
                  continue
              if not name or not content:
                  print(f"[!] {tag} has only one of FILE/CONTENT set, skip")
                  continue
              # 安全校验：只允许一个纯文件名，防止路径穿越
              if "/" in name or "\\" in name or ".." in name:
                  print(f"[!] {tag} invalid file name, skip: {name}")
                  continue
              p = pathlib.Path("site") / name
              p.write_text(content, encoding="utf-8")
              print(f"[i] {tag} verification file written: {name}")
          PY
        env:
          GSC_VERIFY_FILE: ${{ secrets.GSC_VERIFY_FILE }}
          GSC_VERIFY_CONTENT: ${{ secrets.GSC_VERIFY_CONTENT }}
          BING_VERIFY_FILE: ${{ secrets.BING_VERIFY_FILE }}
          BING_VERIFY_CONTENT: ${{ secrets.BING_VERIFY_CONTENT }}

      # 确保 Pages 项目存在（首次运行自动创建；已存在则忽略报错）。
      # 这样无需手动在 Cloudflare 控制台走"创建应用"向导。
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CF_PAGES_PROJECT || 'apprank' }} --production-branch=main

      # 部署到 Cloudflare Pages。项目名通过 CF_PAGES_PROJECT 变量配置（默认 apprank）。
      # 生产 URL = https://<project>.pages.dev；换成自定义域名后 URL 由 SITE_BASE_URL 决定。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT || 'apprank' }} --branch=main
